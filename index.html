<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>ポモドーロタイマー</title>
  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      color: #172433;
      background: #eaf3f1;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body {
      --accent: #15776d;
      --surface: #eaf3f1;
      margin: 0;
      min-height: 100vh;
      background: var(--surface);
      transition: background-color .35s ease;
    }
    body.break {
      --accent: #a35b2b;
      --surface: #fff1e5;
    }
    main {
      width: min(100% - 32px, 520px);
      margin: 0 auto;
      padding: clamp(24px, 6vh, 56px) 0 40px;
    }
    h1 { margin: 0 0 8px; font-size: clamp(1.45rem, 5vw, 1.9rem); text-align: center; }
    .intro { margin: 0 0 26px; color: #56636b; text-align: center; font-size: .95rem; }
    .card {
      background: #fff;
      border-radius: 28px;
      box-shadow: 0 16px 48px rgba(23, 36, 51, .09);
      padding: clamp(24px, 6vw, 38px);
      text-align: center;
    }
    .phase {
      display: inline-block;
      border-radius: 999px;
      padding: 8px 18px;
      background: var(--surface);
      color: var(--accent);
      font-weight: 800;
      letter-spacing: .08em;
    }
    .dial {
      width: min(72vw, 290px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      margin: 26px auto 18px;
      border-radius: 50%;
      background: conic-gradient(var(--accent) var(--progress, 100%), #e8edf0 0);
      transition: background .25s linear;
    }
    .dial-inner {
      width: calc(100% - 14px);
      height: calc(100% - 14px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #fff;
    }
    .time {
      color: var(--accent);
      font-size: clamp(3.8rem, 15vw, 5.4rem);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -.055em;
      font-variant-numeric: tabular-nums;
    }
    .time-label { margin-top: 7px; color: #65737c; font-size: .9rem; }
    .notice {
      min-height: 3em;
      margin: 0 0 18px;
      line-height: 1.5;
      font-weight: 600;
    }
    .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    button {
      min-height: 52px;
      border: 2px solid var(--accent);
      border-radius: 14px;
      background: #fff;
      color: var(--accent);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
    }
    button.primary { color: #fff; background: var(--accent); }
    button:hover:not(:disabled) { filter: brightness(.94); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button:focus-visible, input:focus-visible { outline: 3px solid #298bd0; outline-offset: 3px; }
    .settings { margin-top: 20px; padding: 22px; border-radius: 22px; background: rgba(255,255,255,.8); }
    h2 { margin: 0 0 17px; font-size: 1.06rem; }
    .minutes { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .field label { display: block; margin-bottom: 7px; font-weight: 700; }
    .field input {
      width: 100%;
      height: 48px;
      padding: 0 12px;
      border: 1px solid #aebbc0;
      border-radius: 10px;
      background: #fff;
      color: #172433;
      font: inherit;
      font-size: 1.1rem;
    }
    .setting-note { margin: 10px 0 18px; color: #56636b; font-size: .82rem; line-height: 1.5; }
    .sound-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .switch-label { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; cursor: pointer; }
    .switch-label input { width: 22px; height: 22px; accent-color: var(--accent); cursor: pointer; }
    .test-button { min-height: 42px; padding: 0 14px; font-size: .9rem; }
    .count { margin: 20px 0 0; text-align: center; font-weight: 700; }
    .count strong { color: var(--accent); font-size: 1.45rem; font-variant-numeric: tabular-nums; }
    .flash .card { animation: glow .7s ease-out 2; }
    @keyframes glow { 50% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--accent) 25%, transparent); } }
    @media (max-width: 380px) {
      .card { padding: 20px 16px; }
      .controls { gap: 6px; }
      button { font-size: .92rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main>
    <h1>ポモドーロタイマー</h1>
    <p class="intro">集中と休憩をくり返して、無理なく進めましょう。</p>

    <section class="card" aria-label="タイマー">
      <div class="phase" id="phase">集中中</div>
      <div class="dial" id="dial">
        <div class="dial-inner">
          <div class="time" id="time" role="timer" aria-label="残り時間 25分00秒">25:00</div>
          <div class="time-label">残り時間</div>
        </div>
      </div>
      <p class="notice" id="notice" role="status" aria-live="polite">「開始」を押すとタイマーが動きます。</p>
      <div class="controls">
        <button class="primary" id="start" type="button">開始</button>
        <button id="pause" type="button" disabled>一時停止</button>
        <button id="reset" type="button">リセット</button>
      </div>
    </section>

    <section class="settings" aria-labelledby="settings-title">
      <h2 id="settings-title">時間と音の設定</h2>
      <div class="minutes">
        <div class="field">
          <label for="focus-minutes">集中（分）</label>
          <input id="focus-minutes" type="number" min="1" max="180" step="1" value="25" inputmode="numeric">
        </div>
        <div class="field">
          <label for="break-minutes">休憩（分）</label>
          <input id="break-minutes" type="number" min="1" max="180" step="1" value="5" inputmode="numeric">
        </div>
      </div>
      <p class="setting-note">1〜180分で設定できます。進行中の時間には、次の切り替えから反映されます。</p>
      <div class="sound-row">
        <label class="switch-label" for="sound"><input id="sound" type="checkbox" role="switch" checked>音を鳴らす</label>
        <button class="test-button" id="test-sound" type="button">テスト音</button>
      </div>
    </section>
    <p class="count">完了した集中：<strong id="completed">0</strong> 回</p>
  </main>

  <script>
    (() => {
      'use strict';

      const $ = (id) => document.getElementById(id);
      const ui = {
        phase: $('phase'), time: $('time'), dial: $('dial'), notice: $('notice'),
        start: $('start'), pause: $('pause'), reset: $('reset'),
        focus: $('focus-minutes'), break: $('break-minutes'),
        sound: $('sound'), testSound: $('test-sound'), completed: $('completed')
      };

      let phase = 'focus';
      let durationMs = 25 * 60_000;
      let remainingMs = durationMs;
      let endAt = 0;
      let running = false;
      let startedCurrent = false;
      let completed = 0;
      let audioContext = null;
      let flashTimeout = null;

      function minutes(input) {
        const value = Number(input.value);
        const safe = Number.isFinite(value) ? Math.min(180, Math.max(1, Math.round(value))) : Number(input.defaultValue);
        input.value = String(safe);
        return safe;
      }

      function phaseDuration(nextPhase) {
        return minutes(nextPhase === 'focus' ? ui.focus : ui.break) * 60_000;
      }

      function format(ms) {
        const seconds = Math.ceil(Math.max(0, ms) / 1000);
        return `${String(Math.floor(seconds / 60)).padStart(2, '0')}:${String(seconds % 60).padStart(2, '0')}`;
      }

      function render() {
        const totalSeconds = Math.ceil(Math.max(0, remainingMs) / 1000);
        const minutesLeft = Math.floor(totalSeconds / 60);
        const secondsLeft = totalSeconds % 60;
        ui.time.textContent = format(remainingMs);
        ui.time.setAttribute('aria-label', `残り時間 ${minutesLeft}分${String(secondsLeft).padStart(2, '0')}秒`);
        ui.phase.textContent = phase === 'focus' ? '集中中' : '休憩中';
        ui.dial.style.setProperty('--progress', `${Math.min(100, Math.max(0, remainingMs / durationMs * 100))}%`);
        document.body.classList.toggle('break', phase === 'break');
        ui.start.disabled = running;
        ui.pause.disabled = !running;
        ui.testSound.disabled = !ui.sound.checked;
        ui.completed.textContent = String(completed);
        document.title = `${format(remainingMs)}｜${phase === 'focus' ? '集中' : '休憩'}｜ポモドーロタイマー`;
      }

      function unlockAudio() {
        if (!ui.sound.checked) return;
        try {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) return;
          if (!audioContext) audioContext = new AudioContextClass();
          if (audioContext.state === 'suspended') audioContext.resume().catch(() => {});
        } catch (_) { /* 音声非対応の環境でもタイマーは使える */ }
      }

      function beep() {
        if (!ui.sound.checked) return;
        unlockAudio();
        if (!audioContext) return;
        try {
          const startTime = audioContext.currentTime;
          for (let i = 0; i < 5; i += 1) {
            const pulseStart = startTime + i * 0.63;
            const pulseEnd = pulseStart + 0.48;
            const oscillator = audioContext.createOscillator();
            const gain = audioContext.createGain();
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(880, pulseStart);
            gain.gain.setValueAtTime(0.0001, pulseStart);
            gain.gain.exponentialRampToValueAtTime(0.22, pulseStart + 0.02);
            gain.gain.setValueAtTime(0.22, pulseEnd - 0.04);
            gain.gain.exponentialRampToValueAtTime(0.0001, pulseEnd);
            oscillator.connect(gain);
            gain.connect(audioContext.destination);
            oscillator.start(pulseStart);
            oscillator.stop(pulseEnd);
          }
        } catch (_) { /* 音声が使えなくても画面で知らせる */ }
      }

      function flash() {
        document.body.classList.remove('flash');
        void document.body.offsetWidth;
        document.body.classList.add('flash');
        clearTimeout(flashTimeout);
        flashTimeout = setTimeout(() => document.body.classList.remove('flash'), 1600);
      }

      function tick() {
        if (!running) return;
        const now = Date.now();
        let changed = false;
        let transitions = 0;
        while (now >= endAt && transitions < 10000) {
          if (phase === 'focus') {
            completed += 1;
            phase = 'break';
            ui.notice.textContent = `集中が完了しました。${minutes(ui.break)}分間休憩しましょう。`;
          } else {
            phase = 'focus';
            ui.notice.textContent = `休憩が終わりました。${minutes(ui.focus)}分間集中しましょう。`;
          }
          durationMs = phaseDuration(phase);
          endAt += durationMs;
          startedCurrent = true;
          changed = true;
          transitions += 1;
        }
        remainingMs = Math.max(0, endAt - now);
        if (changed) { flash(); beep(); }
        render();
      }

      ui.start.addEventListener('click', () => {
        if (running) return;
        unlockAudio();
        running = true;
        startedCurrent = true;
        endAt = Date.now() + remainingMs;
        ui.notice.textContent = phase === 'focus' ? '集中しましょう。' : '休憩しましょう。';
        render();
      });

      ui.pause.addEventListener('click', () => {
        if (!running) return;
        remainingMs = Math.max(0, endAt - Date.now());
        running = false;
        ui.notice.textContent = '一時停止中です。「開始」で再開できます。';
        render();
      });

      ui.reset.addEventListener('click', () => {
        running = false;
        phase = 'focus';
        durationMs = phaseDuration(phase);
        remainingMs = durationMs;
        startedCurrent = false;
        completed = 0;
        ui.notice.textContent = 'リセットしました。「開始」を押すとタイマーが動きます。';
        document.body.classList.remove('flash');
        render();
      });

      for (const input of [ui.focus, ui.break]) {
        input.addEventListener('change', () => {
          minutes(input);
          if (!startedCurrent && (phase === 'focus' ? input === ui.focus : input === ui.break)) {
            durationMs = phaseDuration(phase);
            remainingMs = durationMs;
          }
          render();
        });
      }

      ui.sound.addEventListener('change', () => {
        if (ui.sound.checked) unlockAudio();
        render();
      });
      ui.testSound.addEventListener('click', beep);

      setInterval(tick, 250);
      render();
    })();
  </script>
</body>
</html>
